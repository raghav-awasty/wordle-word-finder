<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Wordle Word Finder</title>

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="public/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="public/favicon.svg">
  <link rel="icon" type="image/png" sizes="16x16" href="public/favicon.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="public/favicon.svg">

  <!-- Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="public/css/base.css">
  <link rel="stylesheet" href="public/css/index.css">
</head>
<body>
  <div class="nav-buttons">
    <a href="src/history.html">📜 Word History</a>
    <a href="src/submit.html">📝 Submit Word</a>
  </div>

  <h1>Wordle Word Finder</h1>

  <p class="grid-hint">Type your guesses, then tap each tile to set its colour.</p>

  <!-- Guess grid is built by index.js so the markup stays in one place. -->
  <div id="guessGrid" class="guess-grid" role="group" aria-label="Wordle guesses"></div>

  <!-- Off-screen input: gives mobile browsers a keyboard to attach to. -->
  <input type="text" id="keyboardProxy" class="keyboard-proxy" autocomplete="off"
         autocorrect="off" autocapitalize="off" spellcheck="false" aria-hidden="true" tabindex="-1">

  <div class="grid-actions">
    <button type="button" id="clearButton">Clear</button>
  </div>

  <div id="results"></div>

  <!-- Scripts -->
  <script src="public/js/common.js"></script>
  <script src="public/js/index.js"></script>
</body>
</html>
