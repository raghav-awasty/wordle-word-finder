<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Wordle Word Finder</title>

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="public/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="public/favicon.svg">
  <link rel="icon" type="image/png" sizes="16x16" href="public/favicon.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="public/favicon.svg">

  <!-- Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="public/css/base.css">
  <link rel="stylesheet" href="public/css/index.css">
</head>
<body>
  <div class="nav-buttons">
    <a href="src/history.html">📜 Word History</a>
    <a href="src/submit.html">📝 Submit Word</a>
  </div>

  <h1>Wordle Word Finder</h1>

  <p class="grid-hint">Type your guesses, then tap each tile to set its colour.</p>

  <!-- The proxy input must sit ON SCREEN and overlap the grid: iOS refuses to
       open the keyboard for an element parked off-viewport. It is invisible and
       ignores pointer events, so taps still land on the tiles beneath it. -->
  <div class="grid-wrap">
    <!-- Guess grid is built by index.js so the markup stays in one place. -->
    <div id="guessGrid" class="guess-grid" role="group" aria-label="Wordle guesses"></div>
    <input type="text" id="keyboardProxy" class="keyboard-proxy" autocomplete="off"
           autocorrect="off" autocapitalize="none" spellcheck="false"
           inputmode="text" aria-label="Type your guess">

  </div>

  <div class="grid-actions">
    <button type="button" id="clearButton">Clear</button>
  </div>

  <div id="results"></div>

  <!-- Revealed when a result chip is tapped; submits that word straight to
       the Word of the Day workflow without a trip to the submit page. -->
  <div id="submitBar" class="submit-bar" hidden>
    <button type="button" id="submitSelected" class="submit-bar-action"></button>
    <button type="button" id="submitDismiss" class="submit-bar-dismiss" aria-label="Dismiss">&times;</button>
  </div>

  <!-- Scripts -->
  <script src="public/js/common.js"></script>
  <script src="public/js/index.js"></script>
</body>
</html>
